<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dell Digital — Workplace Communautaire</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dell-blue: #0076CE;
    --neon: #00D4FF;
    --neon2: #00FF94;
    --bg: #04080F;
    --bg2: #080E1A;
    --surface: #0D1526;
    --surface2: #111C32;
    --border: rgba(0,212,255,0.15);
    --text: #E8F4FF;
    --muted: #6B8CAE;
    --accent: #FF6B35;
    --admin: #B06FE2;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 20% 20%,rgba(0,118,206,0.08) 0%,transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%,rgba(0,212,255,0.06) 0%,transparent 50%);
  }

  /* ── TOPBAR ── */
  .topbar {
    position:fixed; top:0; left:0; right:0; height:60px;
    background:rgba(4,8,15,0.95); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; z-index:1000;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-badge {
    width:34px; height:34px; background:var(--dell-blue); border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron',monospace; font-weight:900; font-size:13px; color:#fff;
  }
  .logo-text { font-family:'Orbitron',monospace; font-weight:700; font-size:14px; letter-spacing:2px; }
  .logo-text span { color:var(--neon); }

  /* TOP NAV — catégories principales */
  .top-cats { display:flex; gap:2px; }
  .top-cat {
    padding:7px 14px; border-radius:6px; font-size:13px; font-weight:500;
    color:var(--muted); cursor:pointer; transition:all 0.2s; border:1px solid transparent;
    display:flex; align-items:center; gap:6px;
  }
  .top-cat:hover { color:var(--text); background:rgba(255,255,255,0.05); }
  .top-cat.active { color:var(--neon); background:rgba(0,212,255,0.08); border-color:var(--border); }
  .top-cat.admin-cat { color:var(--admin); }
  .top-cat.admin-cat.active { color:var(--admin); background:rgba(176,111,226,0.1); border-color:rgba(176,111,226,0.3); }

  .topbar-right { display:flex; align-items:center; gap:10px; }
  .btn-primary {
    background:var(--dell-blue); color:#fff; border:none; padding:7px 16px;
    border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s;
  }
  .btn-primary:hover { background:var(--neon); color:var(--bg); }
  .btn-outline {
    background:transparent; color:var(--neon); border:1px solid var(--neon);
    padding:7px 16px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s;
  }
  .btn-outline:hover { background:var(--neon); color:var(--bg); }
  .avatar {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,var(--dell-blue),var(--neon));
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; cursor:pointer; border:2px solid var(--border);
  }
  .cart-btn {
    position:relative; background:var(--surface); border:1px solid var(--border);
    color:var(--text); width:34px; height:34px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px;
  }
  .cart-count {
    position:absolute; top:-5px; right:-5px;
    background:var(--accent); color:#fff; font-size:9px; font-weight:800;
    width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }

  /* ── SUBNAV BAR — rubriques ── */
  .subnav {
    position:fixed; top:60px; left:0; right:0; height:44px;
    background:rgba(8,14,26,0.97); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,212,255,0.08);
    display:flex; align-items:center; padding:0 24px; gap:4px;
    z-index:999; overflow-x:auto;
  }
  .subnav::-webkit-scrollbar { height:0; }
  .subnav-label {
    font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); margin-right:8px; white-space:nowrap;
    padding-right:12px; border-right:1px solid var(--border);
  }
  .sub-item {
    padding:5px 14px; border-radius:20px; font-size:12px; font-weight:500;
    color:var(--muted); cursor:pointer; transition:all 0.18s;
    border:1px solid transparent; white-space:nowrap;
  }
  .sub-item:hover { color:var(--text); background:rgba(255,255,255,0.05); }
  .sub-item.active { color:var(--neon); background:rgba(0,212,255,0.1); border-color:rgba(0,212,255,0.25); }
  .sub-item.admin-sub.active { color:var(--admin); background:rgba(176,111,226,0.1); border-color:rgba(176,111,226,0.3); }

  /* ── LAYOUT ── */
  .layout { display:flex; padding-top:104px; min-height:100vh; position:relative; z-index:1; }

  /* ── SIDEBAR ── */
  .sidebar {
    width:210px; min-height:calc(100vh - 104px);
    background:var(--bg2); border-right:1px solid var(--border);
    padding:20px 0; flex-shrink:0; position:sticky;
    top:104px; height:calc(100vh - 104px); overflow-y:auto;
  }
  .sidebar-section { margin-bottom:24px; padding:0 14px; }
  .sidebar-label {
    font-size:9px; font-weight:700; letter-spacing:2px; color:var(--muted);
    text-transform:uppercase; padding:0 8px; margin-bottom:6px;
  }
  .sidebar-item {
    display:flex; align-items:center; gap:9px; padding:8px 10px;
    border-radius:7px; cursor:pointer; font-size:13px; color:var(--muted);
    transition:all 0.18s; border:1px solid transparent;
  }
  .sidebar-item:hover { color:var(--text); background:rgba(255,255,255,0.04); }
  .sidebar-item.active { color:var(--neon); background:rgba(0,212,255,0.08); border-color:var(--border); }
  .sidebar-item .icon { font-size:14px; width:18px; text-align:center; }
  .sidebar-badge {
    margin-left:auto; background:var(--dell-blue); color:#fff;
    font-size:9px; font-weight:700; padding:2px 6px; border-radius:8px;
  }
  .sidebar-item.admin-item.active { color:var(--admin); background:rgba(176,111,226,0.08); border-color:rgba(176,111,226,0.25); }

  /* ── MAIN ── */
  .main { flex:1; padding:28px 32px; overflow-y:auto; }

  /* ── SUBPAGES ── */
  .subpage { display:none; animation:fadeIn 0.25s ease; }
  .subpage.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* ── BREADCRUMB ── */
  .breadcrumb {
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted); margin-bottom:20px;
  }
  .breadcrumb .sep { color:var(--border); }
  .breadcrumb .current { color:var(--neon); font-weight:600; }

  /* ── PAGE HEADER ── */
  .page-header { margin-bottom:28px; }
  .page-header h1 {
    font-family:'Orbitron',monospace; font-size:24px; font-weight:800;
    letter-spacing:1px; margin-bottom:6px;
  }
  .page-header h1 span { color:var(--neon); }
  .page-header h1 span.admin { color:var(--admin); }
  .page-header p { color:var(--muted); font-size:13px; }

  /* ── CARDS ── */
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px;
    transition:all 0.22s;
  }
  .card:hover { border-color:rgba(0,212,255,0.3); box-shadow:0 0 20px rgba(0,212,255,0.05); }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }

  /* ── STATS ── */
  .stat-card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 22px; position:relative; overflow:hidden;
  }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .stat-card.blue::before { background:linear-gradient(90deg,var(--dell-blue),var(--neon)); }
  .stat-card.green::before { background:linear-gradient(90deg,var(--neon2),#00A86B); }
  .stat-card.orange::before { background:linear-gradient(90deg,var(--accent),#FFB347); }
  .stat-card.purple::before { background:linear-gradient(90deg,#7B2FBE,var(--admin)); }
  .stat-value { font-family:'Orbitron',monospace; font-size:26px; font-weight:800; margin-bottom:4px; }
  .stat-label { font-size:11px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:1px; }
  .stat-delta { font-size:11px; color:var(--neon2); margin-top:6px; }

  /* ── POST ── */
  .post-card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px; margin-bottom:14px; transition:all 0.2s;
  }
  .post-card:hover { border-color:rgba(0,212,255,0.28); }
  .post-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .post-avatar {
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
  }
  .post-meta h4 { font-size:13px; font-weight:600; }
  .post-meta span { font-size:11px; color:var(--muted); }
  .post-content { font-size:13.5px; color:#C8D8E8; line-height:1.7; margin-bottom:12px; }
  .post-tag {
    display:inline-block; background:rgba(0,118,206,0.18); color:var(--neon);
    font-size:10px; padding:2px 9px; border-radius:20px;
    border:1px solid rgba(0,212,255,0.18); margin-right:5px; margin-bottom:8px;
  }
  .post-actions {
    display:flex; gap:18px; padding-top:10px; border-top:1px solid var(--border);
  }
  .post-action { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); cursor:pointer; transition:color 0.2s; }
  .post-action:hover { color:var(--neon); }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family:'Orbitron',monospace; font-size:12px; font-weight:700;
    letter-spacing:2px; color:var(--neon); text-transform:uppercase;
    margin-bottom:14px; display:flex; align-items:center; gap:10px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .section-title.admin-title { color:var(--admin); }

  /* ── PRODUCT ── */
  .product-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:all 0.22s; }
  .product-card:hover { border-color:rgba(0,212,255,0.38); transform:translateY(-2px); box-shadow:0 6px 28px rgba(0,118,206,0.12); }
  .product-image { height:160px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:52px; position:relative; }
  .product-image::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,transparent 50%,rgba(4,8,15,0.4)); }
  .badge-new { position:absolute; top:10px; right:10px; background:var(--neon2); color:var(--bg); font-size:9px; font-weight:800; padding:2px 7px; border-radius:3px; z-index:1; text-transform:uppercase; letter-spacing:1px; }
  .badge-promo { background:var(--accent) !important; }
  .product-body { padding:16px; }
  .product-name { font-weight:700; font-size:14px; margin-bottom:3px; }
  .product-spec { font-size:11px; color:var(--muted); margin-bottom:12px; line-height:1.6; }
  .product-footer { display:flex; align-items:center; justify-content:space-between; }
  .product-price { font-family:'Orbitron',monospace; font-size:16px; font-weight:700; color:var(--neon); }
  .product-price small { font-size:10px; color:var(--muted); font-family:'DM Sans',sans-serif; display:block; }
  .btn-cart { background:var(--dell-blue); color:#fff; border:none; padding:7px 14px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .btn-cart:hover { background:var(--neon); color:var(--bg); }

  /* ── FILTER ── */
  .filter-bar { display:flex; gap:7px; margin-bottom:20px; flex-wrap:wrap; }
  .filter-chip { padding:5px 14px; border-radius:18px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--border); color:var(--muted); transition:all 0.18s; background:transparent; }
  .filter-chip:hover,.filter-chip.active { border-color:var(--dell-blue); color:var(--neon); background:rgba(0,118,206,0.1); }

  /* ── SEARCH ── */
  .search-bar { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 14px; margin-bottom:18px; }
  .search-bar input { background:transparent; border:none; outline:none; color:var(--text); font-size:13px; flex:1; font-family:'DM Sans',sans-serif; }
  .search-bar input::placeholder { color:var(--muted); }

  /* ── COURSE ── */
  .course-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:all 0.22s; display:flex; flex-direction:column; }
  .course-card:hover { border-color:rgba(0,212,255,0.3); transform:translateY(-2px); }
  .course-banner { height:110px; display:flex; align-items:center; justify-content:center; font-size:38px; position:relative; }
  .course-level { position:absolute; bottom:8px; left:10px; font-size:9px; font-weight:700; padding:2px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:1px; }
  .level-d { background:rgba(0,255,148,0.2); color:var(--neon2); }
  .level-i { background:rgba(0,118,206,0.2); color:var(--neon); }
  .level-a { background:rgba(255,107,53,0.2); color:var(--accent); }
  .course-body { padding:16px; flex:1; }
  .course-title { font-weight:700; font-size:14px; margin-bottom:5px; }
  .course-desc { font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:12px; }
  .course-meta { display:flex; gap:14px; font-size:11px; color:var(--muted); margin-bottom:12px; }
  .progress-bar { height:3px; background:rgba(255,255,255,0.07); border-radius:2px; margin-bottom:5px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--dell-blue),var(--neon)); border-radius:2px; }
  .progress-text { font-size:10px; color:var(--muted); }
  .course-footer { padding:12px 16px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .course-instructor { font-size:11px; color:var(--muted); }
  .course-instructor strong { color:var(--text); }

  /* ── EVENT ── */
  .event-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; display:flex; gap:16px; transition:all 0.2s; margin-bottom:12px; }
  .event-card:hover { border-color:rgba(0,212,255,0.28); }
  .event-date-box { width:56px; height:56px; background:rgba(0,118,206,0.14); border:1px solid rgba(0,118,206,0.28); border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .event-day { font-family:'Orbitron',monospace; font-size:18px; font-weight:800; color:var(--neon); line-height:1; }
  .event-month { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:1px; }
  .event-info { flex:1; }
  .event-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--dell-blue); margin-bottom:4px; }
  .event-title { font-weight:700; font-size:14px; margin-bottom:5px; }
  .event-details { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:10px; }
  .event-tags { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .event-seats { font-size:11px; color:var(--neon2); margin-left:auto; font-weight:600; }

  /* ── FORUM ── */
  .forum-cat { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:18px; overflow:hidden; }
  .forum-cat-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:rgba(0,118,206,0.05); }
  .forum-cat-icon { width:34px; height:34px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .forum-cat-title { font-weight:700; font-size:14px; }
  .forum-cat-count { font-size:11px; color:var(--muted); }
  .forum-cat-stats { margin-left:auto; font-size:11px; color:var(--muted); text-align:right; }
  .forum-thread { padding:12px 18px; border-bottom:1px solid rgba(255,255,255,0.03); display:flex; align-items:center; gap:12px; cursor:pointer; transition:background 0.15s; }
  .forum-thread:last-child { border-bottom:none; }
  .forum-thread:hover { background:rgba(255,255,255,0.02); }
  .thread-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot-new { background:var(--neon); box-shadow:0 0 5px var(--neon); }
  .dot-read { background:var(--muted); }
  .thread-info { flex:1; }
  .thread-title { font-size:13px; font-weight:500; margin-bottom:2px; }
  .thread-meta { font-size:11px; color:var(--muted); }
  .thread-stats { font-size:11px; color:var(--muted); text-align:right; }
  .thread-stats span { display:block; }
  .new-post-btn { background:linear-gradient(135deg,var(--dell-blue),var(--neon)); color:#fff; border:none; padding:9px 20px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:7px; }
  .new-post-btn:hover { opacity:0.85; transform:translateY(-1px); }

  /* ── MEMBER ── */
  .member-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; align-items:center; gap:12px; transition:all 0.2s; }
  .member-card:hover { border-color:rgba(0,212,255,0.28); }
  .member-ava { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; border:2px solid var(--border); flex-shrink:0; }
  .member-name { font-weight:600; font-size:13px; }
  .member-role { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .mbadge { font-size:9px; padding:2px 7px; border-radius:8px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .mbadge-e { background:rgba(0,212,255,0.14); color:var(--neon); border:1px solid rgba(0,212,255,0.25); }
  .mbadge-p { background:rgba(0,255,148,0.1); color:var(--neon2); border:1px solid rgba(0,255,148,0.22); }
  .mbadge-m { background:rgba(255,107,53,0.1); color:var(--accent); border:1px solid rgba(255,107,53,0.22); }

  /* ── ADMIN ── */
  .admin-stat { background:var(--surface); border:1px solid rgba(176,111,226,0.2); border-radius:12px; padding:18px 22px; position:relative; overflow:hidden; }
  .admin-stat::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,#7B2FBE,var(--admin)); }
  .admin-table { width:100%; border-collapse:collapse; font-size:13px; }
  .admin-table th { text-align:left; padding:10px 14px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); border-bottom:1px solid var(--border); }
  .admin-table td { padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .admin-table tr:last-child td { border-bottom:none; }
  .admin-table tr:hover td { background:rgba(176,111,226,0.04); }
  .status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; }
  .status-active { background:var(--neon2); box-shadow:0 0 4px var(--neon2); }
  .status-pending { background:#FFB347; }
  .status-banned { background:var(--accent); }
  .role-badge { font-size:10px; padding:2px 8px; border-radius:6px; font-weight:600; }
  .role-admin { background:rgba(176,111,226,0.2); color:var(--admin); }
  .role-mod { background:rgba(255,107,53,0.15); color:var(--accent); }
  .role-user { background:rgba(0,118,206,0.15); color:var(--neon); }
  .admin-action-btn { background:rgba(176,111,226,0.15); color:var(--admin); border:1px solid rgba(176,111,226,0.3); padding:4px 10px; border-radius:5px; font-size:11px; cursor:pointer; transition:all 0.2s; }
  .admin-action-btn:hover { background:rgba(176,111,226,0.3); }
  .admin-card { background:var(--surface); border:1px solid rgba(176,111,226,0.18); border-radius:12px; padding:20px; }

  /* ── ANNOUNCEMENT ── */
  .announce-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:14px; border-left:3px solid var(--dell-blue); }
  .announce-card.pinned { border-left-color:var(--accent); }

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let currentCat = 'accueil';
let currentSub = 'annonces';

function showCat(cat, sub) {
  currentCat = cat;
  currentSub = sub;

  // Top nav active
  document.querySelectorAll('.top-cat').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === cat);
  });

  renderSubnav(cat, sub);
  renderSidebar(cat, sub);
  renderContent(cat, sub);
}

function showSub(sub) {
  currentSub = sub;
  renderSubnav(currentCat, sub);
  renderSidebar(currentCat, sub);
  renderContent(currentCat, sub);
}

function renderSubnav(cat, sub) {
  const nav = NAV[cat];
  const isAdmin = cat === 'admin';
  const subnav = document.getElementById('subnav');
  subnav.innerHTML = `<span class="subnav-label">${nav.label}</span>` +
    Object.entries(nav.subs).map(([key,val]) =>
      `<div class="sub-item${sub===key?' active':''}${isAdmin?' admin-sub':''}" onclick="showSub('${key}')">${val.label}</div>`
    ).join('');
}

function renderSidebar(cat, sub) {
  const config = SIDEBAR_CONFIG[cat] || [];
  const isAdmin = cat === 'admin';
  document.getElementById('sidebar').innerHTML = config.map(sec => `
    <div class="sidebar-section">
      <div class="sidebar-label">${sec.label}</div>
      ${sec.items.map(item => `
        <div class="sidebar-item${item.id===sub?' active':''}${isAdmin?' admin-item':''}" ${item.id?`onclick="showSub('${item.id}')"`:''}> 
          <span class="icon">${item.icon}</span>${item.label}
          ${item.badge?`<span class="sidebar-badge">${item.badge}</span>`:''}
        </div>`).join('')}
    </div>`).join('');
}

function renderContent(cat, sub) {
  const key = `${cat}-${sub}`;
  const fn = PAGES[key];
  document.getElementById('mainContent').innerHTML = fn
    ? fn()
    : `<div style="padding:60px;text-align:center;color:var(--muted)"><div style="font-size:48px;margin-bottom:16px">🚧</div><div style="font-family:'Orbitron',monospace;font-size:16px">Page en construction</div></div>`;

  // Re-bind filter chips
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.closest('.filter-bar').querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });
}

// Init
showCat('accueil', 'annonces');
