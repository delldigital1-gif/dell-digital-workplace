<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dell Digital — Workplace</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#0076CE; --neon:#00D4FF; --orange:#E67E22; --olight:#FF9344;
  --green:#00FF94; --bg:#04080F; --bg2:#080E1A; --surf:#0D1526;
  --border:rgba(0,212,255,0.15); --text:#E8F4FF; --muted:#6B8CAE; --admin:#B06FE2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(4,8,15,0.97);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:1000}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--neon));
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',monospace;font-weight:900;font-size:14px;color:#fff}
.logo-text{font-family:'Orbitron',monospace;font-weight:700;font-size:14px;letter-spacing:2px}
.logo-text span{color:var(--orange)}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.top-cats{display:flex;gap:2px}
.top-cat{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;transition:all 0.2s;border:1px solid transparent;display:flex;align-items:center;gap:6px}
.top-cat:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.top-cat.active{color:var(--neon);background:rgba(0,212,255,0.08);border-color:var(--border)}
.top-cat.adm.active{color:var(--admin);background:rgba(176,111,226,0.1);border-color:rgba(176,111,226,0.3)}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-p{background:var(--orange);color:#fff;border:none;padding:7px 16px;border-radius:6px;
  font-size:12px;font-weight:600;cursor:pointer}
.btn-o{background:transparent;color:var(--neon);border:1px solid var(--neon);padding:7px 16px;
  border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  cursor:pointer;border:2px solid var(--border)}
.nb{position:relative;background:var(--surf);border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px}
.nc{position:absolute;top:-5px;right:-5px;background:var(--orange);color:#fff;font-size:9px;
  font-weight:800;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.subnav{position:fixed;top:60px;left:0;right:0;height:44px;background:rgba(8,14,26,0.97);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,212,255,0.08);
  display:flex;align-items:center;padding:0 24px;gap:4px;z-index:999;overflow-x:auto}
.subnav::-webkit-scrollbar{height:0}
.snlbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  margin-right:8px;white-space:nowrap;padding-right:12px;border-right:1px solid var(--border)}
.si{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;color:var(--muted);
  cursor:pointer;transition:all 0.18s;border:1px solid transparent;white-space:nowrap}
.si:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.si.active{color:var(--neon);background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.25)}
.layout{display:flex;padding-top:104px;min-height:100vh}
.sidebar{width:210px;min-height:calc(100vh - 104px);background:var(--bg2);
  border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;
  position:sticky;top:104px;height:calc(100vh - 104px);overflow-y:auto}
.sbs{margin-bottom:24px;padding:0 14px}
.sbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);
  text-transform:uppercase;padding:0 8px;margin-bottom:6px}
.sbi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--muted);transition:all 0.18s;border:1px solid transparent}
.sbi:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.sbi.active{color:var(--orange);background:rgba(230,126,34,0.1);border-color:rgba(230,126,34,0.25)}
.sbdg{margin-left:auto;background:var(--orange);color:#fff;font-size:9px;font-weight:700;
  padding:2px 6px;border-radius:8px}
.main{flex:1;padding:28px 32px;overflow-y:auto}
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:20px}
.bc .sep{color:var(--border)}
.bc .cur{color:var(--orange);font-weight:600}
.ph{margin-bottom:28px}
.ph h1{font-family:'Orbitron',monospace;font-size:22px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
.ph h1 .n{color:var(--neon)}
.ph h1 .o{color:var(--orange)}
.ph p{color:var(--muted);font-size:13px}
.stc{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:18px 22px;
  position:relative;overflow:hidden}
.stc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stc.bl::before{background:linear-gradient(90deg,var(--blue),var(--neon))}
.stc.or::before{background:linear-gradient(90deg,var(--orange),var(--olight))}
.stc.gr::before{background:linear-gradient(90deg,var(--green),#00A86B)}
.stc.pu::before{background:linear-gradient(90deg,#7B2FBE,var(--admin))}
.sv{font-family:'Orbitron',monospace;font-size:26px;font-weight:800;margin-bottom:4px}
.sl{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.sd{font-size:11px;color:var(--green);margin-top:6px}
.sct{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:2px;
  color:var(--neon);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sct::after{content:'';flex:1;height:1px;background:var(--border)}
.sct.or{color:var(--orange)}
.hero{background:linear-gradient(135deg,var(--surf) 0%,#111C32 100%);border:1px solid var(--border);
  border-radius:14px;padding:32px 36px;margin-bottom:24px;position:relative;overflow:hidden}
.hero h2{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;margin-bottom:8px}
.hero p{color:var(--muted);font-size:13px;max-width:480px;line-height:1.7}
.hac{display:flex;gap:10px;margin-top:18px}
.ssc{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px;
  display:flex;gap:16px;margin-bottom:12px}
.sdb{width:60px;height:60px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;flex-shrink:0}
.sday{font-family:'Orbitron',monospace;font-size:20px;font-weight:800;line-height:1}
.smon{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.sinfo{flex:1}
.styp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.stit{font-weight:700;font-size:15px;margin-bottom:5px}
.sdet{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.sseat{font-size:12px;font-weight:600}
.fc{display:flex;flex-direction:column;gap:8px}
.fci{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px}
.fci-icon{font-size:22px;width:40px;height:40px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fci-v{font-family:'Orbitron',monospace;font-size:18px;font-weight:800}
.fci-l{font-size:11px;color:var(--muted)}
.anc{background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:20px;margin-bottom:14px;border-left:3px solid var(--orange)}
.anc.pin{border-left-color:var(--neon)}
.ant{font-weight:700;font-size:15px;margin-bottom:6px}
.anb{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.anm{font-size:11px;color:var(--muted)}
.twc{display:grid;grid-template-columns:1fr 300px;gap:22px}
.rl{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.rl:last-child{border-bottom:none}
.rn{width:30px;height:30px;border-radius:50%;background:rgba(230,126,34,0.15);
  border:1px solid rgba(230,126,34,0.3);display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--orange);flex-shrink:0}
.rt{font-weight:600;font-size:14px;margin-bottom:4px}
.rd{font-size:12px;color:var(--muted);line-height:1.6}
.fb{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.fc2{padding:5px 14px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);color:var(--muted);transition:all 0.18s;background:transparent}
.fc2:hover,.fc2.active{border-color:var(--orange);color:var(--orange);background:rgba(230,126,34,0.1)}
.pc{background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:18px;margin-bottom:14px}
.pc:hover{border-color:rgba(230,126,34,0.28)}
.ph2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;flex-shrink:0}
.pmeta h4{font-size:13px;font-weight:600}
.pmeta span{font-size:11px;color:var(--muted)}
.pact{display:flex;gap:18px;padding-top:10px;border-top:1px solid var(--border)}
.pac{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.pac:hover{color:var(--orange)}
.svc{background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.svc:hover{border-color:rgba(230,126,34,0.38);transform:translateY(-2px)}
.svi{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px}
.svb{padding:16px}
.svn{font-weight:700;font-size:14px;margin-bottom:5px}
.svd{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.svp{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--orange)}
.svp small{font-size:10px;color:var(--muted);font-family:'DM Sans',sans-serif;display:block}
.adst{background:var(--surf);border:1px solid rgba(176,111,226,0.2);border-radius:12px;
  padding:18px 22px;position:relative;overflow:hidden}
.adst::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#7B2FBE,var(--admin))}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(230,126,34,0.3);border-radius:3px}
@media(max-width:768px){.sidebar{display:none}.g2,.g3,.g4{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-badge">D</div>
    <div>
      <div class="logo-text">DELL <span>DIGITAL</span></div>
      <div class="logo-sub">Workplace &middot; Lom&eacute;, Togo</div>
    </div>
  </div>
  <nav class="top-cats" id="topCats">
    <div class="top-cat" data-cat="accueil" onclick="showCat('accueil','dashboard')">&#127968; Accueil</div>
    <div class="top-cat" data-cat="formations" onclick="showCat('formations','sessions')">&#127891; Formations</div>
    <div class="top-cat" data-cat="clients" onclick="showCat('clients','liste')">&#128101; Clients</div>
    <div class="top-cat" data-cat="services" onclick="showCat('services','catalogue')">&#128188; Services</div>
    <div class="top-cat" data-cat="communication" onclick="showCat('communication','posts')">&#128226; Communication</div>
    <div class="top-cat" data-cat="partenaires" onclick="showCat('partenaires','bafe')">&#129309; Partenaires</div>
    <div class="top-cat adm" data-cat="admin" onclick="showCat('admin','dashboard')">&#9881; Admin</div>
  </nav>
  <div class="topbar-right">
    <div class="nb">&#128276;<span class="nc">3</span></div>
    <button class="btn-p">+ Nouvelle action</button>
    <div class="avatar">LK</div>
  </div>
</header>

<div class="subnav" id="subnav"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<script>
const NAV = {
  accueil:      { label:'ACCUEIL',        subs:{ dashboard:'Dashboard', annonces:'Annonces', agenda:'Agenda', charte:'Charte' } },
  formations:   { label:'FORMATIONS',     subs:{ sessions:'Sessions juin', inscriptions:'Inscriptions', modules:'Modules' } },
  clients:      { label:'CLIENTS',        subs:{ liste:'Tous les clients', prospects:'Prospects B2B' } },
  services:     { label:'SERVICES',       subs:{ catalogue:'Catalogue', devis:'Devis', factures:'Factures' } },
  communication:{ label:'COMMUNICATION',  subs:{ posts:'Posts reseaux', planning:'Planning editorial', flyers:'Flyers' } },
  partenaires:  { label:'PARTENAIRES',    subs:{ bafe:'Bafe & Associes' } },
  admin:        { label:'ADMINISTRATION', subs:{ dashboard:'Dashboard admin', paiements:'Paiements', parametres:'Parametres' } }
};

const SIDEBAR = {
  accueil:      [{ lbl:'Navigation', items:[{id:'dashboard',ic:'📊',lb:'Dashboard'},{id:'annonces',ic:'📣',lb:'Annonces',bg:'3'},{id:'agenda',ic:'📅',lb:'Agenda juin'},{id:'charte',ic:'📜',lb:'Charte Dell Digital'}] }],
  formations:   [{ lbl:'Gestion', items:[{id:'sessions',ic:'🗓️',lb:'Sessions juin',bg:'3'},{id:'inscriptions',ic:'📋',lb:'Inscriptions',bg:'0'},{id:'modules',ic:'📚',lb:'Modules'}] }],
  clients:      [{ lbl:'Clients', items:[{id:'liste',ic:'👥',lb:'Tous les clients'},{id:'prospects',ic:'🎯',lb:'Prospects B2B'}] }],
  services:     [{ lbl:'Services', items:[{id:'catalogue',ic:'💼',lb:'Catalogue services'},{id:'devis',ic:'📄',lb:'Devis'},{id:'factures',ic:'🧾',lb:'Factures'}] }],
  communication:[{ lbl:'Contenu', items:[{id:'posts',ic:'📱',lb:'Posts reseaux'},{id:'planning',ic:'📅',lb:'Planning editorial'},{id:'flyers',ic:'🖼️',lb:'Flyers'}] }],
  partenaires:  [{ lbl:'Partenaires', items:[{id:'bafe',ic:'🏢',lb:'Bafe & Associes'}] }],
  admin:        [{ lbl:'Administration', items:[{id:'dashboard',ic:'📊',lb:'Dashboard'},{id:'paiements',ic:'💳',lb:'Paiements',bg:'0'},{id:'parametres',ic:'⚙️',lb:'Parametres'}] }]
};

function renderSubnav(cat, sub) {
  const nav = NAV[cat];
  let h = '<span class="snlbl">' + nav.label + '</span>';
  for (const [k, v] of Object.entries(nav.subs)) {
    h += '<div class="si' + (sub===k?' active':'') + '" onclick="showSub(\''+k+'\')">' + v + '</div>';
  }
  document.getElementById('subnav').innerHTML = h;
}

function renderSidebar(cat, sub) {
  const cfg = SIDEBAR[cat] || [];
  let h = '';
  cfg.forEach(function(sec) {
    h += '<div class="sbs"><div class="sbl">' + sec.lbl + '</div>';
    sec.items.forEach(function(item) {
      h += '<div class="sbi' + (item.id===sub?' active':'') + '"' + (item.id?' onclick="showSub(\''+item.id+'\')"':'') + '>';
      h += '<span>' + item.ic + '</span>' + item.lb;
      if (item.bg) h += '<span class="sbdg">' + item.bg + '</span>';
      h += '</div>';
    });
    h += '</div>';
  });
  document.getElementById('sidebar').innerHTML = h;
}

function renderContent(cat, sub) {
  const fn = PAGES[cat + '-' + sub];
  document.getElementById('main').innerHTML = fn ? fn() :
    '<div style="padding:60px;text-align:center;color:var(--muted)"><div style="font-size:48px;margin-bottom:16px">🚧</div><div style="font-family:Orbitron,monospace;font-size:16px;color:var(--orange)">Page en construction</div></div>';
  document.querySelectorAll('.fc2').forEach(function(chip) {
    chip.addEventListener('click', function() {
      chip.closest('.fb').querySelectorAll('.fc2').forEach(function(c){c.classList.remove('active')});
      chip.classList.add('active');
    });
  });
}

let cat = 'accueil', sub = 'dashboard';

function showCat(c, s) {
  cat = c; sub = s;
  document.querySelectorAll('.top-cat').forEach(function(el){
    el.classList.toggle('active', el.dataset.cat === c);
  });
  renderSubnav(c, s);
  renderSidebar(c, s);
  renderContent(c, s);
}

function showSub(s) {
  sub = s;
  renderSubnav(cat, s);
  renderSidebar(cat, s);
  renderContent(cat, s);
}

// ═══════════════════════════════════
// PAGES
// ═══════════════════════════════════
const PAGES = {};

PAGES['accueil-dashboard'] = function() {
  return '<div class="bc"><span>Accueil</span><span class="sep">›</span><span class="cur">Dashboard</span></div>' +
  '<div class="hero"><h2>Bonjour, <span style="color:var(--orange)">Lynx</span> 👋</h2>' +
  '<p>Bienvenue sur Dell Digital Workplace. Formation de juin 2026 — inscriptions ouvertes !</p>' +
  '<div class="hac"><button class="btn-p" onclick="showCat(\'formations\',\'inscriptions\')">📋 Voir les inscriptions</button>' +
  '<button class="btn-o" onclick="showCat(\'communication\',\'posts\')">📱 Gerer les posts</button></div></div>' +
  '<div class="g4" style="margin-bottom:24px">' +
  '<div class="stc or"><div class="sv" style="color:var(--orange)">0</div><div class="sl">Inscriptions</div><div class="sd">Lancement 8 juin</div></div>' +
  '<div class="stc bl"><div class="sv" style="color:var(--neon)">3</div><div class="sl">Sessions planifiees</div><div class="sd">23, 25, 28 juin</div></div>' +
  '<div class="stc gr"><div class="sv" style="color:var(--green)">0 FCFA</div><div class="sl">Revenus generes</div><div class="sd">T-Money / Flooz</div></div>' +
  '<div class="stc pu"><div class="sv" style="color:var(--admin)">11</div><div class="sl">Posts planifies</div><div class="sd">3 semaines</div></div></div>' +
  '<div class="twc">' +
  '<div>' +
  '<div class="sct or">Prochaines sessions</div>' +
  '<div class="ssc"><div class="sdb" style="background:rgba(0,118,206,0.15);border:1px solid rgba(0,118,206,0.3)"><div class="sday" style="color:var(--neon)">23</div><div class="smon" style="color:var(--muted)">juin</div></div>' +
  '<div class="sinfo"><div class="styp" style="color:var(--neon)">🔵 SESSION PREMIUM</div><div class="stit">Assistant IA en 1h</div><div class="sdet">Fonctionnaires & Dirigeants · 18h-20h · 35 000 FCFA</div><div class="sseat" style="color:var(--green)">✅ 20 places disponibles</div></div></div>' +
  '<div class="ssc"><div class="sdb" style="background:rgba(230,126,34,0.15);border:1px solid rgba(230,126,34,0.3)"><div class="sday" style="color:var(--orange)">25</div><div class="smon" style="color:var(--muted)">juin</div></div>' +
  '<div class="sinfo"><div class="styp" style="color:var(--orange)">🟠 SESSION STANDARD</div><div class="stit">Assistant IA en 1h</div><div class="sdet">Entrepreneurs & Salaries · 18h-20h · 25 000 FCFA</div><div class="sseat" style="color:var(--green)">✅ 20 places disponibles</div></div></div>' +
  '<div class="ssc"><div class="sdb" style="background:rgba(0,168,107,0.15);border:1px solid rgba(0,168,107,0.3)"><div class="sday" style="color:var(--green)">28</div><div class="smon" style="color:var(--muted)">juin</div></div>' +
  '<div class="sinfo"><div class="styp" style="color:var(--green)">🟢 SESSION ETUDIANTS</div><div class="stit">Assistant IA en 1h</div><div class="sdet">Etudiants & Eleves · 18h-20h · 15 000 FCFA</div><div class="sseat" style="color:var(--green)">✅ 20 places disponibles</div></div></div>' +
  '</div>' +
  '<div>' +
  '<div class="sct">Infos Dell Digital</div>' +
  '<div class="fc">' +
